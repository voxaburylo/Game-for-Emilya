<!doctype html><html lang="uk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Перевірка записів · Буквомісто</title><style>body{font:18px system-ui;background:#f8f6e9;color:#294331;margin:40px}button{font:inherit;padding:18px;border:0;border-radius:12px;background:#d3e9b8;cursor:pointer}li{margin:7px}a{color:#325839}</style><h1>Перевірка готових записів</h1><p>Технічна перевірка файлів, декодування браузером та офлайн-кешу. Не перевіряє правильність вимови.</p><button id="check">Перевірити 32 записи</button><p id="summary">Очікування</p><ol id="results"></ol><p id="cache"></p><a href="/">Повернутися до гри</a><script>
document.querySelector('#check').onclick=async()=>{const b=document.querySelector('#check');b.disabled=true;const list=document.querySelector('#results');list.replaceChildren();let passed=0;const ctx=new (window.AudioContext||window.webkitAudioContext)();for(const letter of [...'АБВГҐДЕЄЖЗИІЇЙКЛМНОПРСТУФХЦЧШЩЮЯ']){const li=document.createElement('li');list.append(li);try{const response=await fetch('audio/'+letter.codePointAt(0).toString(16)+'.mp3');if(!response.ok)throw Error('HTTP '+response.status);if(!response.headers.get('content-type').includes('audio/'))throw Error('Тип файлу');const bytes=await response.arrayBuffer(),byteCount=bytes.byteLength,sound=await ctx.decodeAudioData(bytes);let peak=0;for(const v of sound.getChannelData(0))peak=Math.max(peak,Math.abs(v));if(sound.duration<.15||sound.duration>6||peak<.01)throw Error('Тривалість або порожній звук');passed++;li.textContent='✓ '+letter+' · '+sound.duration.toFixed(2)+' с · '+byteCount+' байтів'}catch(e){li.textContent='✗ '+letter+' · '+e.message}document.querySelector('#summary').textContent=passed+' / 32 успішно'}await ctx.close();try{const keys=await caches.keys(),name=keys.filter(k=>k.startsWith('bukvomisto')).pop();if(!name)throw Error('Немає кешу');const cache=await caches.open(name),files=await cache.keys();const count=files.filter(r=>r.url.endsWith('.mp3')).length;document.querySelector('#cache').textContent='Офлайн-кеш: '+count+' / 32 записів · '+name}catch(e){document.querySelector('#cache').textContent='Офлайн-кеш: '+e.message}b.disabled=false};
</script></html>
