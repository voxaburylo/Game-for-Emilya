name: Publish iPhone web app

on:
  push:
    branches:
      - codex/organic-world
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build static game
        run: |
          node build-web.cjs dist
          touch dist/.nojekyll
          cp -R dist /tmp/emilia-site

      - name: Publish gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages
          git rm -rf .
          cp -R /tmp/emilia-site/. .
          git add -A
          git commit -m "Publish iPhone web app"
          git push --force origin gh-pages
